<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>CMOSTACKS Expense Tracker</title>
      <link rel="stylesheet" href="./style.css?v=3">
  </head>
    <body>
  <header class="brand-header">
    <div class="brand-icon" aria-hidden="true">$</div>
    <div class="brand-text">
      <h1>CMOSTACKS</h1>
      <p>EXPENSE TRACKER</p>
    </div>
  </header>
      
      <h2>Add a New Expense</h2>

      <form id="expense-form">
        <label for="expense-name">Expense Name</label>
        <input type="text" id="expense-name" placeholder="e.g. Groceries" required>

        <label for="expense-amount">Amount ($)</label>
        <input type="number" id="expense-amount" placeholder="e.g. 45.00" min="0.01" step="0.01" required>

        <button type="submit">Add Expense</button>
    </form>
      <h2>Expense Summary</h2>
      <p>Total: $<span id="total">0.00</span></p>

      <ul id="expense-list"></ul>

      <section id="calendar-section">
        <h2>Expense Calendar</h2>
        <p>Choose a date to view your expenses.</p>

        <div class="calendar-header">
          <button type="button" id="prev-month"> </button>
          <h3 id="calendar-month"></h3>
          <button type="button" id="next-month"> </button>
        </div>

        <div id="calendar-grid" class="calendar-grid"></div>

        <div id="selected-date-details">
          <h3>Expense for <span id="selected-date"></span></h3>
          <ul id="calendar-expense-list"></ul>
          <p>Daily Total: $<span id="daily-total">0.00</span></p>
        </div>
      </section>  
      
        <script src="script.js"></script>
    </body>
    </html>
